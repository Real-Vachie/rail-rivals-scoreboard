<style>
:root { --bg:#f6f3ec; --card:#fffdf8; --ink:#24211c; --muted:#6f685c; --line:#e2dccf;

* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui, sans-serif; }
main { max-width:760px; margin:0 auto; padding:20px 16px 48px; }

.sub { color:var(--muted); margin:0 0 18px; }

.score { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.side { border-radius:10px; padding:12px; border:2px solid var(--line); }
.side.lb { border-color:var(--lb); } .side.cs { border-color:var(--cs); }
.side b { display:block; font-size:1.5rem; } .side small { color:var(--muted); }
.win { font-weight:600; }
table { width:100%; border-collapse:collapse; font-size:.92rem; }
th, td { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); white-space:nowrap; }
td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
.lbc { color:var(--lb); } .csc { color:var(--cs); }
pre { white-space:pre-wrap; font:14px/1.45 ui-monospace, monospace; margin:0; }
svg { width:100%; height:auto; display:block; }
.legend { display:flex; gap:16px; font-size:.9rem; color:var(--muted); margin-top:6px; }
.dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; }
.scroll { overflow-x:auto; }
.story h3 { font-size:1rem; margin:0 0 6px; } .story p { margin:0; }
details summary { cursor:pointer; font-weight:600; } details .story { border-top:1px solid var(--line); padding:10px 0 0; margin:10px 0 0; }
code { font:13px/1.4 ui-monospace, monospace; }
.tag { display:inline-block; padding:1px 8px; border-radius:99px; font-size:.8rem; border:1px solid var(--line); margin-left:6px; }
.tag.none { color:var(--muted); } .tag.maybe { border-color:#c9a227; } .tag.notes { border-color:var(--cs); font-weight:600; }
.story small { color:var(--muted); display:block; margin:0 0 2px; }

}

  if (!D.lab.length) c.insertAdjacentHTML("beforeend", `<small>None yet: rails only since night 1. When the race goes stale the Lab starts a new era (road vehicles, ships, aircraft, arctic, bigger maps).</small>`);
  else c.insertAdjacentHTML("beforeend", `<table><tr><th>Date</th><th>From night</th><th>What</th><th>Why</th></tr>` +
    D.lab.map(x => `<tr><td>${x.date}</td><td>${x.from_night}</td><td>${x.era}: ${x.what}</td><td>${x.why}</td></tr>`).join("") + `</table>`);
  if (D.logbook) { c = card("Logbook Lines' latest logbook"); const p = $("pre"); p.textContent = D.logbook; c.append(p); }
  c = card("All nights");
  c.insertAdjacentHTML("beforeend", `<div class="scroll"><table><tr><th>#</th><th>Date</th><th class="n lbc">Logbook</th><th class="n csc">Clean Slate</th><th>New bots</th><th class="n">Tokens</th></tr>` +
    D.nights.slice().reverse().map(n => `<tr><td>${n.night}</td><td>${n.date}</td><td class="n${n.winner == "logbook" ? " win" : ""}">${money(n.avg.logbook)}</td>` +
    `<td class="n${n.winner == "clean-slate" ? " win" : ""}">${money(n.avg["clean-slate"])}</td><td>${n.accepted}</td><td class="n">${n.tokens ? n.tokens.toLocaleString("en-GB") : "–"}</td></tr>` +
    (n.notes.length ? `<tr><td></td><td colspan="5"><small>${n.notes.map(s => s.replace(/</g, "&lt;")).join(" · ")}</small></td></tr>` : "")).join("") + `</table></div>`);
}
</script></body></html>
