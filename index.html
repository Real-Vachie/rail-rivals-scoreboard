<style>
:root { --bg:#f6f3ec; --card:#fffdf8; --ink:#24211c; --muted:#6f685c; --line:#e2dccf;
  --lb:#2f6db3; --cs:#c2562f; }
@media (prefers-color-scheme: dark) { :root { --bg:#1a1916; --card:#24221e; --ink:#ede8de; --muted:#9d968a;
  --line:#36332d; --lb:#6fa3e0; --cs:#e7835c; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui, sans-serif; }
main { max-width:760px; margin:0 auto; padding:20px 16px 48px; }
h1 { font-size:1.6rem; margin:0 0 4px; } h2 { font-size:1.1rem; margin:0 0 10px; }
.sub { color:var(--muted); margin:0 0 18px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin:0 0 14px; }
.score { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.side { border-radius:10px; padding:12px; border:2px solid var(--line); }
.side.lb { border-color:var(--lb); } .side.cs { border-color:var(--cs); }
.side b { display:block; font-size:1.5rem; } .side small { color:var(--muted); }
.win { font-weight:600; }
table { width:100%; border-collapse:collapse; font-size:.92rem; }
th, td { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); white-space:nowrap; }
td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
.lbc { color:var(--lb); } .csc { color:var(--cs); }
pre { white-space:pre-wrap; font:14px/1.45 ui-monospace, monospace; margin:0; }
svg { width:100%; height:auto; display:block; }
.legend { display:flex; gap:16px; font-size:.9rem; color:var(--muted); margin-top:6px; }
.dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; }
.scroll { overflow-x:auto; }
.story h3 { font-size:1rem; margin:0 0 6px; } .story p { margin:0; }
details summary { cursor:pointer; font-weight:600; } details .story { border-top:1px solid var(--line); padding:10px 0 0; margin:10px 0 0; }
code { font:13px/1.4 ui-monospace, monospace; }
.tag { display:inline-block; padding:1px 8px; border-radius:99px; font-size:.8rem; border:1px solid var(--line); margin-left:6px; }
.tag.none { color:var(--muted); } .tag.maybe { border-color:#c9a227; } .tag.notes { border-color:var(--cs); font-weight:600; }
.story small { color:var(--muted); display:block; margin:0 0 2px; }
</style></head><body><main>

<div id="app"></div>

book": 262176, "clean-slate": 437395}, {"map": 2, "first": "clean-slate", "logbook": 1, "clean-slate": 1865939}, {"map": 3, "first": "logbook", "logbook": 129435, "clean-slate": 2081164}, {"map": 4, "first": "clean-slate", "logbook": 305076, "clean-slate": 2410312}, {"map": 5, "first": "logbook", "logbook": 593795, "clean-slate": 242365}], "tokens": 21971, "accepted": "CS \u2713 LB \u2713", "notes": [], "commentary": {"headline": "Clean Slate Lines Takes Night 4, Leads Series Three-One", "text": "Clean Slate Lines won night 4 easily, averaging \u00a31,407,435 to Logbook Lines' \u00a3258,097, and now leads the series three nights to one. It took four of five maps, three of them above \u00a31.8 million. Both bots raised their line limits, Clean Slate to 14 and Logbook to 12, but neither came close to them. Clean Slate ran 5.2 trains per map and finished with no debt. Logbook Lines, following the logbook, let towns serve two lines and stopped turning track on slopes, and those slope errors vanished from its warnings. Yet it averaged only 1.2 trains, its idle map-years rose from 2 to 21, and map 2 ended at \u00a31 again. Its one win came on map 5, \u00a3593,795 to \u00a3242,365.", "tokens": 6322}, "watch": {"sides": {"logbook": {"verdict": "maybe", "quote": "// Plan the path before spending money on stations; failed lines left the company at \u00a31.", "why": "The clause 'failed lines left the company at \u00a31' reports a past outcome, which reads like a result from an earlier night rather than a code rationale."}, "clean-slate": {"verdict": "none", "quote": "", "why": "All comments and strings describe current code behavior or output labels, with no reference to past runs, results, or plans."}}, "tokens": 2522, "model": "claude-haiku-5-5"}}, {"night": 5, "date": "2026-10-25-2", "winner": "clean-slate", "avg": {"logbook": 51113, "clean-slate": 1506281}, "years": {"logbook": {"1951": 1, "1952": 83, "1953": 805, "1954": 1284, "1955": 2099, "1956": 2947, "1957": 3835, "19 er attempts, not a pure code rationale. Otherwise the NEW comments describe code behavior."}, "clean-slate": {"verdict": "none", "quote": "", "why": "All comments and strings describe current code behavior or the reason for it. No nights, results, or plans appear."}}, "tokens": 3170, "model": "claude-haiku-5-5"}}], "lab": [], "era": "Rails only \u00b7 trains only", "logbook": "# Logbook Lines - LOGBOOK\n\n## 2026-10-25 night 6 (after night 5)\nNight 5: LOST 51k vs 1506k avg. Maps 1,4 at \u00a31. We avg 1.2 trains vs rival 7.4.\nProfit/train similar (\u00a311k vs \u00a315k). 28 map-years with no trains. Value 1953 only \u00a3805:\nwe sink the max loan into stations + partial track of lines that then fail.\nWarnings: \"No path\" x14, SLOPED_WRONG x8, Station A ERR_UNKNOWN x4.\nFound BUG: retry after a rail failure re-pathed from the station, but our own built track\ncounts as unbuildable in StepCost -> retry path had to avoid it -> No path / dangling track.\n\n## Changes tonight (night 6 bot)\n- BuildPath returns failing index (-1 = ok). Repair: re-path from tile before the failure\n  (back off up to 5 tiles), keep built track, up to 15 repairs, test-mode cost check each.\n- StepCost: slopes along travel axis cost 3, other non-steep slopes cost 6 (foundations).\n- FindPath: arrive straight on a sloped goal tile (avoid turn on slope).\n\n## Night 1-4 lessons\n- Round-0 code: max 2 lines, 1 pax train each. Loan at max at end lowers value.\n- Company value ~ cash - loan + vehicle value; track/stations are sunk cost.\n- Rival value ~ trains * profit * years: ONLY lever is number of working lines, built early.\n- Night 2 won 193k vs 152k with up to 6 lines; night 3 added path-before-stations,\n  test-mode cost check (cost*1.2+45k vs cash), fill 3-tile platform with wagons.\n- Night 4: no turns from sloped tiles cut ERR_LAND_SLOPED_WRONG to 0.\n- Night 5: road-vehicle retry (Sleep 15, 8x), distance 25-60, 16 lines, A* 60000: no gain.\n\n## Next hypotheses (in order)\n1. If const $ = s => document.createElement(s);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const money = v => "£" + Math.round(v).toLocaleString("en-GB");
const app = document.getElementById("app");
function card(title) { const c = $("div"); c.className = "card"; if (title) { const h = $("h2"); h.textContent = title; c.append(h); } app.append(c); return c; }
function chart(series, labels) {
  const W = 400, H = 220, P = 40, max = Math.max(1, ...series.flatMap(s => s.v));
  const x = i => P + (W - P - 10) * (labels.length > 1 ? i / (labels.length - 1) : 0.5), y = v => H - 24 - (H - 40) * v / max;
  let g = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for (let k = 0; k <= 4; k++) { const v = max * k / 4; g += `<line x1="${P}" x2="${W - 10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>` +
    `<text x="${P - 6}" y="${y(v) + 4}" text-anchor="end" font-size="12" fill="var(--muted)">${v >= 1000 ? Math.round(v / 1000) + "k" : Math.round(v)}</text>`; }
  const step = Math.ceil(labels.length / 8);
  labels.forEach((l, i) => { if (i % step == 0 || i == labels.length - 1) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="12" fill="var(--muted)">${l}</text>`; });
  series.forEach(s => {
    g += `<polyline fill="none" stroke="${s.c}" stroke-width="2" points="${s.v.map((v, i) => x(i) + "," + y(v)).join(" ")}"/>`;
    s.v.forEach((v, i) => g += `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${s.c}"><title>${labels[i]}: ${money(v)}</title></circle>`);
  });
  return g + "</svg>";
}
function legend() { return `<div class="legend"><span><span class="dot" style="background:var(--lb)"></span>Logbook Lines</span><span><span class="dot" style="background:var(--cs)"></span>Clean Slate Lines</span></div>`; }
if (!D.nights.length) { card().textContent = "No nights played yet."; }
else {
  const last = D.nights[D.nights.length - 1];
  const wins = { logbook: 0, "clean-slate": 0 };
  D.nights.forEach(n => { if (n.winner) wins[n.winner]++; });
  const story = n => `<div class="story"><small>Night ${n.night} · ${n.date} · ${n.winner ? D.names[n.winner] + " won" : "a tie"}</small>` +
    `<h3>${esc(n.commentary.headline)}</h3><p>${esc(n.commentary.text)}</p></div>`;
  const told = D.nights.filter(n => n.commentary && n.commentary.text);
  if (told.length) {
    let c = card("What happened");

    c.insertAdjacentHTML("beforeend", story(newest));
    const older = told.slice(0, -1).reverse();
    if (older.length) c.insertAdjacentHTML("beforeend", `<details><summary>Earlier nights (${older.length})</summary>${older.map(story).join("")}</details>`);

  c = card("Last night, map by map");

    last.maps.map(m => `<tr><td>${m.map}</td><td>${D.names[m.first]}</td><td class="n">${money(m.logbook)}</td><td class="n">${money(m["clean-slate"])}</td></tr>`).join("") + `</table></div>`);

    const row = (n, s) => { const w = n.watch.sides[s] || {}; return `<div class="story"><small>${D.names[s]}<span class="tag ${esc(w.verdict)}">${esc(w.verdict || "?")}</span></small>` +
      (w.quote ? `<p><code>${esc(w.quote)}</code></p>` : "") + `<p style="color:var(--muted);font-size:.9rem">${esc(w.why || "")}</p></div>`; };
    const lw = watched[watched.length - 1];
    c.insertAdjacentHTML("beforeend", `<small style="color:var(--muted)">Bots written after night ${lw.night}</small>` + ["clean-slate", "logbook"].map(s => row(lw, s)).join(""));
    const ow = watched.slice(0, -1).reverse();
    if (ow.length) c.insertAdjacentHTML("beforeend", `<details style="margin-top:10px"><summary>Earlier nights (${ow.length})</summary>` +
      ow.map(n => `<div class="story"><small>After night ${n.night}: ` + ["clean-slate", "logbook"].map(s => `${D.names[s]}<span class="tag ${esc((n.watch.sides[s] || {}).verdict)}">${esc((n.watch.sides[s] || {}).verdict || "?")}</span>`).join(" &nbsp; ") +
      `</small>` + ["clean-slate", "logbook"].filter(s => (n.watch.sides[s] || {}).quote).map(s => `<p style="font-size:.9rem">${D.names[s]}: <code>${esc(n.watch.sides[s].quote)}</code></p>`).join("") + `</div>`).join("") + `</details>`);
  }
  c = card("Lab changes (both rivals at once, one at a time)");
  c.insertAdjacentHTML("beforeend", `<p class="sub" style="margin:0 0 8px">Now: ${D.era}</p>`);

    D.lab.map(x => `<tr><td>${x.date}</td><td>${x.from_night}</td><td>${x.era}: ${x.what}</td><td>${x.why}</td></tr>`).join("") + `</table>`);
  if (D.logbook) { c = card("Logbook Lines' latest logbook"); const p = $("pre"); p.textContent = D.logbook; c.append(p); }
  c = card("All nights");
  c.insertAdjacentHTML("beforeend", `<div class="scroll"><table><tr><th>#</th><th>Date</th><th class="n lbc">Logbook</th><th class="n csc">Clean Slate</th><th>New bots</th><th class="n">Tokens</th></tr>` +
    D.nights.slice().reverse().map(n => `<tr><td>${n.night}</td><td>${n.date}</td><td class="n${n.winner == "logbook" ? " win" : ""}">${money(n.avg.logbook)}</td>` +
    `<td class="n${n.winner == "clean-slate" ? " win" : ""}">${money(n.avg["clean-slate"])}</td><td>${n.accepted}</td><td class="n">${n.tokens ? n.tokens.toLocaleString("en-GB") : "–"}</td></tr>` +
    (n.notes.length ? `<tr><td></td><td colspan="5"><small>${n.notes.map(s => s.replace(/</g, "&lt;")).join(" · ")}</small></td></tr>` : "")).join("") + `</table></div>`);
}
